services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: classroom
      POSTGRES_PASSWORD: classroom
      POSTGRES_DB: classroom
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classroom -d classroom"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://classroom:classroom@db:5432/classroom?schema=public
      AUTH_SECRET: docker-dev-secret-change-in-production
      AUTH_URL: http://localhost:3000
      QR_SIGNING_SECRET: docker-qr-secret
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
